<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberDefense CTF 2026 - registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <script src="js/config.js"></script>

    <style>
        :root {
            --bg-base: #050a10;
            --bg-glass: rgba(20, 25, 40, 0.6);
            --bg-glass-hover: rgba(30, 40, 60, 0.85);
            --bg-card: rgba(15, 20, 35, 0.8);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            --text-label: #cbd5e1;
            --accent-primary: #0066ff;
            --accent-secondary: #00c2ff;
            --accent-success: #00cc66;
            --accent-error: #ff3366;
            --input-bg: #111620;
            --input-border: #334155;
            --input-focus: #0066ff;
            --font-head: 'Space Grotesk', sans-serif;
            --font-body: 'DM Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(0, 102, 255, .05) 25%, rgba(0, 102, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 102, 255, .05) 75%, rgba(0, 102, 255, .05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 102, 255, .05) 25%, rgba(0, 102, 255, .05) 26%, transparent 27%, transparent 74%, rgba(0, 102, 255, .05) 75%, rgba(0, 102, 255, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            z-index: 0;
            opacity: 0.3;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 50px 50px;
            }
        }

        /* Glowing Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 1;
            animation: float 15s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-primary);
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-secondary);
            bottom: 20%;
            right: 10%;
            animation-delay: 5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(50px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-30px, 30px) scale(0.9);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        /* Header */
        .form-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-top: 2rem;
        }

        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-family: var(--font-head);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: translateX(-5px);
        }

        .form-title {
            font-family: var(--font-head);
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .form-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            max-width: 600px;
            margin: 0 auto 1rem;
        }

        /* Form Card */
        .form-card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-group label .required {
            color: var(--accent-error);
            margin-left: 0.25rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
            background: rgba(17, 22, 32, 0.9);
        }

        .member-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .member-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-glass);
        }

        .member-icon {
            color: var(--accent-primary);
            font-size: 1.2rem;
        }

        .member-label {
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* Submit Button */
        .submit-section {
            text-align: center;
            margin-top: 2rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 1rem 3rem;
            border-radius: 8px;
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.3);
            text-transform: uppercase;
            width: 100%;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 102, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .form-header {
                margin-bottom: 1.5rem;
            }

            .form-title {
                font-size: 1.75rem;
            }

            .form-card {
                padding: 1.5rem;
            }

            .back-btn {
                position: static;
                margin-bottom: 1.5rem;
            }
        }

        /* Success Message */
        .success-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 10, 16, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .success-overlay.show {
            display: flex;
        }

        .success-content {
            text-align: center;
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            background: var(--bg-glass);
            border: 1px solid var(--accent-success);
            border-radius: 16px;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--accent-success);
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> Home
        </a>

        <div class="form-header">
            <h1 class="form-title">Team Registration</h1>
            <p class="form-subtitle">Register your team for CyberDefense CTF 2026</p>
        </div>

        <form id="registrationForm" class="form-card">
            <!-- Team Info Row -->
            <div class="form-row">
                <div class="form-group">
                    <label for="teamName">Team Name<span class="required">*</span></label>
                    <input type="text" id="teamName" name="teamName" class="form-control" placeholder="Enter team name"
                        required>
                </div>
                <div class="form-group">
                    <label for="memberCount">Number of Members<span class="required">*</span></label>
                    <select id="memberCount" class="form-control" required>
                        <option value="2">2 Members</option>
                        <option value="3">3 Members</option>
                        <option value="4" selected>4 Members</option>
                    </select>
                </div>
            </div>

            <div id="membersContainer">
                <!-- Member forms will be injected here -->
            </div>

            <div class="submit-section">
                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-paper-plane"></i> Register Team
                </button>
            </div>
        </form>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-content">
            <div class="success-icon"><i class="fas fa-check-circle"></i></div>
            <h2 style="font-family: var(--font-head); margin-bottom: 1rem;">Registration Successful!</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Your team is registered for CyberDefense CTF 2026.
            </p>
            <a href="index.html" class="btn-submit" style="text-decoration: none; display: block;">Back to Home</a>
        </div>
    </div>

    <script>
        const membersContainer = document.getElementById('membersContainer');
        const memberCountSelect = document.getElementById('memberCount');
        const form = document.getElementById('registrationForm');
        const successOverlay = document.getElementById('successOverlay');

        const DEPARTMENTS = [
            'Computer Engineering',
            'CSE AI and ML',
            'CSE Data Science',
            'Information Technology'
        ];

        function createMemberForm(index, isLeader = false) {
            const card = document.createElement('div');
            card.className = 'member-card';

            const headerStr = isLeader ? '👑 Team Leader Details' : `👤 Team Member ${index} Details`;

            card.innerHTML = `
                <div class="member-header">
                    <div class="member-icon"><i class="fas ${isLeader ? 'fa-crown' : 'fa-user'}"></i></div>
                    <div class="member-label">${headerStr}</div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name<span class="required">*</span></label>
                        <input type="text" name="name${index}" class="form-control" placeholder="Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address<span class="required">*</span></label>
                        <input type="email" name="email${index}" class="form-control" placeholder="student@apsit.edu.in" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Moodle ID<span class="required">*</span></label>
                        <input type="text" name="moodle${index}" class="form-control" placeholder="Enter Moodle ID" required>
                    </div>
                    <div class="form-group">
                        <label>Department<span class="required">*</span></label>
                        <select name="dept${index}" class="form-control" required>
                            <option value="">Select Dept</option>
                            ${DEPARTMENTS.map(d => `<option value="${d}">${d}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
            return card;
        }

        function updateMemberForms() {
            const count = parseInt(memberCountSelect.value);
            membersContainer.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                membersContainer.appendChild(createMemberForm(i, i === 1));
            }
        }

        memberCountSelect.addEventListener('change', updateMemberForms);
        window.addEventListener('load', updateMemberForms);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';

            try {
                const formData = new FormData(form);
                const count = parseInt(memberCountSelect.value);
                const teamMembers = [];

                for (let i = 1; i <= count; i++) {
                    teamMembers.push({
                        name: formData.get(`name${i}`),
                        email: formData.get(`email${i}`),
                        moodle_id: formData.get(`moodle${i}`),
                        department: formData.get(`dept${i}`),
                        is_leader: i === 1
                    });
                }

                const registrationData = {
                    event_name: 'CyberDefense CTF 2026',
                    team_name: formData.get('teamName'),
                    team_members: teamMembers
                };

                const baseURL = window.API_CONFIG?.baseURL || 'http://localhost:8001/api';
                const response = await fetch(`${baseURL}/hackathon-teams`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registrationData)
                });

                if (response.ok) {
                    successOverlay.classList.add('show');
                } else {
                    const result = await response.json();
                    alert('Registration Failed: ' + (result.error?.message || 'Check your details'));
                }
            } catch (error) {
                alert('Connection Error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Register Team';
            }
        });
    </script>
</body>

</html>
