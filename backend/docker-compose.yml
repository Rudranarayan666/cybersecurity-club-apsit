version: "3.9"

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: cybersec_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybersec_club
      POSTGRES_USER: ${DB_USER:-cybersec_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-cybersec_admin} -d cybersec_club" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI Backend
  backend:
    build: .
    container_name: cybersec_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cybersec_admin}:${DB_PASSWORD:-changeme_in_production}@db:5432/cybersec_club
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5500}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      DEBUG: ${DEBUG:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed_db.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
      "

  # Nginx — TLS termination reverse proxy
  nginx:
    image: nginx:alpine
    container_name: cybersec_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

  # Certbot — Let's Encrypt auto-renewal
  certbot:
    image: certbot/certbot
    container_name: cybersec_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done;"

  # Grafana — Monitoring dashboard
  grafana:
    image: grafana/grafana-oss:latest
    container_name: cybersec_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local
  grafana_data:
    driver: local
